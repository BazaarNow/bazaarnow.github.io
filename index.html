  <script>
    (function () {
      console.log("[DEEPLINK] Script started");

      const params = new URLSearchParams(window.location.search);
      console.log("[DEEPLINK] URL params:", window.location.search);

      const isDeferred = params.get("d") === "1";
      console.log("[DEEPLINK] isDeferred =", isDeferred);

      if (!isDeferred) {
        console.log("[DEEPLINK] d=1 not found → exit");
        return;
      }

      if (sessionStorage.getItem("dd_handled")) {
        console.log("[DEEPLINK] Already handled → exit");
        return;
      }

      sessionStorage.setItem("dd_handled", "1");
      console.log("[DEEPLINK] Marked as handled");

      const IOS_STORE = "https://apps.apple.com/in/app/bazaarnow/id6756546224";
      const ANDROID_STORE =
        "https://play.google.com/store/apps/details?id=com.bazaarnow.customerapp";

      const ua = navigator.userAgent || navigator.vendor;
      console.log("[DEEPLINK] UA:", ua);

      let platform = "web";
      if (/android/i.test(ua)) platform = "android";
      else if (/iPhone|iPad|iPod/.test(ua)) platform = "ios";

      console.log("[DEEPLINK] Platform =", platform);

      const path = window.location.pathname;
      console.log("[DEEPLINK] Path =", path);

      if (typeof gtag === "function") {
        console.log("[DEEPLINK] Sending GA event");
        gtag("event", "deferred_deeplink_visit", {
          page_path: path,
          deeplink_flag: 1,
          platform: platform,
        });
      } else {
        console.warn("[DEEPLINK] gtag NOT available");
      }

      let appOpened = false;

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          appOpened = true;
          console.log("[DEEPLINK] App opened (visibility hidden)");
        }
      });

      const cleanUrl = window.location.href.replace(/[?&]d=1/, "");
      console.log("[DEEPLINK] Attempting app open:", cleanUrl);

      window.location.href = cleanUrl;

      setTimeout(() => {
        if (appOpened) {
          console.log("[DEEPLINK] App opened → no store redirect");
          return;
        }

        console.log("[DEEPLINK] App NOT opened → redirecting to store");

        if (platform === "android") {
          console.log("[DEEPLINK] Redirect → Play Store");
          gtag("event", "redirect_playstore", { page_path: path });
          window.location.replace(ANDROID_STORE);
        } else if (platform === "ios") {
          console.log("[DEEPLINK] Redirect → App Store");
          gtag("event", "redirect_appstore", { page_path: path });
          window.location.replace(IOS_STORE);
        } else {
          console.log("[DEEPLINK] Web platform → no redirect");
        }
      }, 1200);
    })();
  </script>
