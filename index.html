<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BazaarNow — Quick Commerce</title>
    <meta
      name="description"
      content="We are building fast, privacy-respecting commerce experiences for our
          customers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Standard favicon -->
    <link rel="icon" href="assets/images/favicon.ico" />

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple iOS icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="assets/manifest.json" />

    <link rel="stylesheet" href="/css/style.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-R80ZTJM0W7"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-R80ZTJM0W7");
    </script>
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="assets/images/apple-touch-icon.png" class="logo" />
        <img src="assets/images/brand_name.svg" class="brand-name" />
      </a>
    </header>

    <main class="container">
      <section class="hero">
        <img src="assets/images/brand_name.svg" class="brand-name" />
        <div class="description">
          We are building fast, privacy-respecting commerce experiences for our
          customers.
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-links">
        <p>
          <a href="/returns-refund-policy">Returns and Refund Policy</a>
          <span class="dot">·</span>
          <a href="/shipping-policy">Shipping Policy</a>
        </p>
        <a href="/privacy-policy">Privacy Policy</a>
        <span class="dot">·</span>
        <a href="/terms-of-service">Terms of Service</a>
        <span class="dot">·</span>
        <a href="/contact-us">Contact Us</a>
      </div>
      <div class="copyright">
        &copy; <span id="year"></span> BAZAARINDIA TECHNOLOGIES PRIVATE LIMITED.
      </div>
    </footer>
  </body>

  <script>
    document.getElementById("year") &&
      (document.getElementById("year").textContent = new Date().getFullYear());
    const params = new URLSearchParams(window.location.search);
    const isBazaarNowApp = params.get("bazaarnowapp") === "true";
    if (isBazaarNowApp) {
      document.getElementsByTagName("header")[0].remove();
      document.getElementsByTagName("footer")[0].remove();
    }
  </script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const isDeferred = params.get("d") === "1";

      // Only handle deferred deeplink traffic
      if (!isDeferred) return;

      // Prevent repeat execution in same session
      if (sessionStorage.getItem("dd_handled")) return;
      sessionStorage.setItem("dd_handled", "1");

      const IOS_STORE = "https://apps.apple.com/in/app/bazaarnow/id6756546224";
      const ANDROID_STORE =
        "https://play.google.com/store/apps/details?id=com.bazaarnow.customerapp";

      const ua = navigator.userAgent || navigator.vendor;
      const path = window.location.pathname;

      let platform = "web";
      if (/android/i.test(ua)) platform = "android";
      else if (/iPhone|iPad|iPod/.test(ua)) platform = "ios";

      // 1️⃣ Track deferred deeplink visit
      gtag("event", "deferred_deeplink_visit", {
        page_path: path,
        deeplink_flag: 1,
        platform: platform,
      });

      let appOpened = false;

      // Detect successful app open
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) appOpened = true;
      });

      // 2️⃣ Attempt app open via Universal/App Link
      const cleanUrl = window.location.href.replace(/[?&]d=1/, "");
      window.location.href = cleanUrl;

      // 3️⃣ Fallback to store if app not installed
      setTimeout(() => {
        if (appOpened) return;

        if (platform === "android") {
          gtag("event", "redirect_playstore", {
            page_path: path,
          });
          window.location.replace(ANDROID_STORE);
        } else if (platform === "ios") {
          gtag("event", "redirect_appstore", {
            page_path: path,
          });
          window.location.replace(IOS_STORE);
        }
      }, 1200);
    })();
  </script>
</html>
