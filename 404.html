<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Preserve full path + hash
      const original = location.pathname + location.hash;

      console.log("[404] Original URL:", original);

      // Redirect to index.html using hash-based redirect
      window.location.replace("/#redirect=" + encodeURIComponent(original));
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
