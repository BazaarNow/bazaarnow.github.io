      name="description"
      content="We are building fast, privacy-respecting commerce experiences for our
          customers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Standard favicon -->
    <link rel="icon" href="assets/images/favicon.ico" />

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-R80ZTJM0W7"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-R80ZTJM0W7");
    </script>
    <script>
      // Preserve path + query + hash
      var redirect =
        "/?" +
        "path=" +
        encodeURIComponent(location.pathname) +
        "&query=" +
        encodeURIComponent(location.search) +
        "&hash=" +
        encodeURIComponent(location.hash);

      window.location.replace(redirect);
    </script>
  </head>

  <body></body>

  <script>
    document.getElementById("year") &&
      (document.getElementById("year").textContent = new Date().getFullYear());
    const params = new URLSearchParams(window.location.search);
    const isBazaarNowApp = params.get("bazaarnowapp") === "true";
    if (isBazaarNowApp) {
      document.getElementsByTagName("header")[0].remove();
      document.getElementsByTagName("footer")[0].remove();
    }
  </script>
