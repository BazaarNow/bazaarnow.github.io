    <!-- Router: restore path from hash -->
    <script>
      (function () {
        console.log("[ROUTER] index.html loaded");
        const hashParams = new URLSearchParams(
          location.hash.replace(/^#/, "?"),
        );
        const redirect = hashParams.get("redirect");
        if (redirect) {
          const decoded = decodeURIComponent(redirect);
          console.log("[ROUTER] Restoring URL:", decoded);
          window.history.replaceState({}, "", decoded);
          window.location.hash = "";
        } else {
          console.log("[ROUTER] Normal load (no redirect)");
        }
      })();
    </script>

    <!-- Deferred Deeplink -->
    <script>
      (function () {
        console.log("[DEEPLINK] Script started");

        // Parse query + hash for d=1
        const searchParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(
          window.location.hash.replace(/^#/, "?"),
        );
        const isDeferred =
          searchParams.get("d") === "1" || hashParams.get("d") === "1";

        console.log("[DEEPLINK] isDeferred =", isDeferred);

        if (!isDeferred) {
          console.log("[DEEPLINK] d=1 not found → exit");
          return;
        }

        if (sessionStorage.getItem("dd_handled")) {
          console.log("[DEEPLINK] Already handled → exit");
          return;
        }

        sessionStorage.setItem("dd_handled", "1");
        console.log("[DEEPLINK] Marked as handled");

        const IOS_STORE =
          "https://apps.apple.com/in/app/bazaarnow/id6756546224";
        const ANDROID_STORE =
          "https://play.google.com/store/apps/details?id=com.bazaarnow.customerapp";

        const ua = navigator.userAgent || navigator.vendor;
        let platform = "web";
        if (/android/i.test(ua)) platform = "android";
        else if (/iPhone|iPad|iPod/.test(ua)) platform = "ios";

        console.log("[DEEPLINK] Platform =", platform);
        const path = window.location.pathname;

        if (typeof gtag === "function") {
          gtag("event", "deferred_deeplink_visit", {
            page_path: path,
            deeplink_flag: 1,
            platform: platform,
          });
        }

        let appOpened = false;
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            appOpened = true;
            console.log("[DEEPLINK] App opened");
          }
        });

        // Remove d=1 from URL
        const params = new URLSearchParams(window.location.search);
        params.delete("d");
        const cleanUrl =
          window.location.pathname +
          (params.toString() ? "?" + params.toString() : "");
        console.log("[DEEPLINK] Attempting app open:", cleanUrl);
        window.location.href = cleanUrl;

        setTimeout(() => {
          if (appOpened) return;
          console.log("[DEEPLINK] App NOT opened → redirecting to store");
          if (platform === "android") {
            gtag("event", "redirect_playstore", { page_path: path });
            window.location.replace(ANDROID_STORE);
          } else if (platform === "ios") {
            gtag("event", "redirect_appstore", { page_path: path });
            window.location.replace(IOS_STORE);
          }
        }, 1200);
      })();
    </script>
